name: Daily Sales Sync

on:
  # تشغيل تلقائي يومياً الساعة 6 صباحاً بتوقيت السعودية (3 UTC)
  schedule:
    - cron: '0 3 * * *'
  # السماح بالتشغيل اليدوي من زر في GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: استلام الكود
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المكتبات
        run: pip install requests

      - name: سحب البيانات من Odoo
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          OUTPUT_FILE: data.json
        run: python fetch.py

      - name: حفظ النتائج في المستودع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "تحديث البيانات تلقائياً - $(date '+%Y-%m-%d')"
          git push
